<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tómbola</title>
    <link rel="stylesheet" href="/src/estilos/tokens.css" />
    <link rel="stylesheet" href="/src/estilos/base.css" />
    <link rel="stylesheet" href="/src/estilos/componentes.css" />
  </head>
  <body>
    <div id="app" class="app">
      <header class="cabecera">
        <input id="titulo" class="titulo" value="Sorteo de premios" aria-label="Título del sorteo" />
      </header>

      <main class="cuerpo">
        <section class="panel" aria-label="Configuración del sorteo">
          <div>
            <label for="participantes">Participantes (uno por línea)</label>
            <textarea
              id="participantes"
              spellcheck="false"
              placeholder="Nombre, correo, teléfono"
            ></textarea>
          </div>

          <p id="avisoLimite" class="aviso" hidden>
            <span id="textoLimite"></span>
          </p>

          <p id="avisoDuplicados" class="aviso" hidden>
            <span id="textoDuplicados"></span>
            <button id="btnQuitarDuplicados" type="button">Quitar repetidos</button>
          </p>

          <div class="fila">
            <div>
              <label for="cantidad">Ganadores por ronda</label>
              <input id="cantidad" type="number" min="1" max="99" value="1" />
            </div>
            <div>
              <label for="modo">Modo</label>
              <select id="modo">
                <option value="lote">Ronda cerrada</option>
                <option value="continuo">Uno a la vez</option>
              </select>
            </div>
          </div>

          <div>
            <label for="repeticion">Repetición</label>
            <select id="repeticion">
              <option value="sin">Sin repetir</option>
              <option value="con">Con repetición</option>
            </select>
          </div>

          <div>
            <label for="premios">Premios (uno por línea, en orden: 1er lugar, 2do, ...)</label>
            <textarea id="premios" placeholder="Ej: Notebook&#10;Audífonos&#10;Vale de compra"></textarea>
          </div>

          <div class="fila">
            <div>
              <label for="logoOrganizador">Logo (centro de la ruleta)</label>
              <input id="logoOrganizador" type="file" accept="image/png,image/svg+xml" />
            </div>
            <div>
              <label for="colorAcento">Color de acento</label>
              <input id="colorAcento" type="color" value="#ffd166" />
            </div>
          </div>
          <button id="btnQuitarLogo" class="boton-silencio" type="button" hidden>
            Quitar logo
          </button>

          <button id="btnGirar" class="boton-girar" type="button">Girar la ruleta</button>
          <div class="fila">
            <button id="btnSilencio" class="boton-silencio" type="button" aria-pressed="false">
              🔊 Sonido
            </button>
            <button id="btnProyeccion" class="boton-silencio" type="button" aria-pressed="false">
              🖥 Proyección
            </button>
          </div>
          <p id="estadoPozo" class="estado"></p>

          <h2>Historial</h2>
          <ol id="historial" class="historial"></ol>
          <div class="fila">
            <button id="btnExportarCSV" class="boton-silencio" type="button">
              Exportar CSV
            </button>
            <button id="btnExportarJSON" class="boton-silencio" type="button">
              Exportar JSON
            </button>
          </div>

          <p id="codigoActa" class="estado"></p>

          <h2>Listas guardadas</h2>
          <p class="estado">
            Estos datos quedan guardados en este navegador; no se suben a
            ningún servidor. No se guardan correos ni teléfonos.
          </p>
          <div>
            <label for="nombreLista">Nombre de la lista</label>
            <input id="nombreLista" type="text" placeholder="Ej: Fiesta de fin de año" />
          </div>
          <div class="fila">
            <button id="btnGuardarLista" class="boton-silencio" type="button">
              Guardar lista actual
            </button>
          </div>
          <div>
            <label for="listasGuardadas">Cargar lista guardada</label>
            <select id="listasGuardadas">
              <option value="">— Elegir —</option>
            </select>
          </div>
          <div class="fila">
            <button id="btnCargarLista" class="boton-silencio" type="button">Cargar</button>
            <button id="btnEliminarLista" class="boton-silencio" type="button">Eliminar</button>
          </div>
          <p id="avisoGuardado" class="aviso" hidden>
            <span id="textoGuardado"></span>
          </p>
          <button id="btnBorrarTodo" class="boton-silencio" type="button">
            Borrar todos los datos
          </button>
        </section>

        <section class="escenario" aria-label="Ruleta">
          <div class="marco-ruleta">
            <div id="marquesina" class="marquesina"></div>
            <canvas id="ruleta" class="ruleta-canvas" aria-hidden="true"></canvas>
            <div id="aguja" class="aguja"></div>
          </div>
        </section>
      </main>
    </div>

    <canvas id="confeti" class="confeti"></canvas>

    <div id="anuncioOverlay" class="anuncio-overlay" hidden>
      <div class="anuncio-ticket" role="dialog" aria-modal="true" aria-labelledby="anuncioNombre">
        <p class="anuncio-puesto" id="anuncioPuesto"></p>
        <h2 class="anuncio-nombre" id="anuncioNombre"></h2>
        <p class="anuncio-premio" id="anuncioPremio" hidden></p>
        <button id="btnCerrarAnuncio" class="boton-cerrar" type="button">Cerrar (Esc)</button>
      </div>
    </div>

    <div id="vivoGanador" aria-live="polite" class="sr-solo"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
